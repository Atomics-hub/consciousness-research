<text x="637.50" y="640.00" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#17212b">Self-minus-yoke high-choice probability contrast</text>
<text x="50.00" y="669.00" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#566573">Source: latent_binary_sensitivity.declared_worst_sensitivity_examples. Values within 1e−12 of zero are displayed as zero.</text>
