<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="690" viewBox="0 0 1050 690" role="img" aria-labelledby="title description">
<title id="title">Latent-binary sensitivity intervals</title>
<desc id="description">Planning-only interval plot of observed high-disposition contrasts and assumption-free latent-binary high-choice bounds in six scenarios.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="50.00" y="46.00" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#17212b">Latent-binary high-choice sensitivity at the stored worst cell</text>
<text x="50.00" y="76.00" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#8f2d20">SYNTHETIC PLANNING ONLY — NO PROVIDER/MODEL OBSERVATIONS</text>
<text x="50.00" y="102.00" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#425466">Horizontal lines are assumption-free bounds; dots are observed H contrasts. Sensitivity is secondary and non-gating.</text>
