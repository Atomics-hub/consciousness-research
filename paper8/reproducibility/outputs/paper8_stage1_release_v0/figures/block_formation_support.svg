<title id="title">Non-gating synthetic block-formation support screen</title>
<desc id="description">Six-cell synthetic comparison of whole-panel block-formation support under independent and shared provider-batch shock profiles, with Wilson intervals. No provider observations; cannot certify B=384.</desc>
