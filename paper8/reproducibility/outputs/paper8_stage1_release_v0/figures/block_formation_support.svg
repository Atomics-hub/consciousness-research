<text x="50.00" y="78.00" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#8f2d20">NON-GATING SYNTHETIC SCREEN — NO PROVIDER OBSERVATIONS — CANNOT CERTIFY B=384</text>
<text x="50.00" y="106.00" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#425466">Six declared cells; 2,000 replicates/cell; vertical bars are Wilson 95% Monte Carlo intervals.</text>
